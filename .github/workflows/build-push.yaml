name: Build & Publish LiteLLM Custom

on:
  push:
    tags:
      - 'v*' # Scatta solo quando pushi un tag tipo v1.0, v1.1, ecc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Fondamentale per scrivere su GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Abilita QEMU: questo permette di compilare per ARM64 su runner x86
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Abilita Docker Buildx: il motore per le build multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login al Registry di GitHub
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Gestione intelligente dei tag (latest + versione)
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # 5. Build & Push Multi-Platform
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # QUI avviene la magia: costruisce per entrambe le architetture
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Opzionale: passa la versione come build-arg se vuoi sovrascriverla dinamicamente
          # build-args: |
          #   LITELLM_VERSION=1.52.10